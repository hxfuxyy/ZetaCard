name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KTLINT_VERSION: 1.7.1
  KTLINT_SHA256: b596a05f09364e1997b644152683af12fef58944f3acfabdf78071f5a490eb98

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: |
          sdkmanager 'platforms;android-37.0'
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Check Kotlin style
        run: |
          curl -sSfL -o "$RUNNER_TEMP/ktlint" "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          echo "${KTLINT_SHA256}  $RUNNER_TEMP/ktlint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/ktlint"
          "$RUNNER_TEMP/ktlint" "app/src/**/*.kt"

      - name: Unit tests, Android lint and debug build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug -PversionSuffix="-preview.${GITHUB_SHA::7}"

      - name: Rename preview APK
        run: |
          name="$(grep '^versionName=' version.properties | cut -d= -f2)"
          cp app/build/outputs/apk/debug/app-debug.apk "ZetaCard-${name}-preview.${GITHUB_SHA::7}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ZetaCard-preview-${{ github.sha }}
          path: ZetaCard-*-debug.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
